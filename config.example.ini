# jagent 配置示例（复制为 config.ini 后修改；config.ini 已被 .gitignore 忽略，不会入库）
# 首次运行 `python main.py` 也会自动生成一份同样的模板。
# 注意：下面所有值都是占位符，请勿把真实密钥提交到仓库。

[llm]
# 任意 OpenAI 兼容接口：LM Studio(http://127.0.0.1:1234/v1)、Ollama(http://127.0.0.1:11434/v1)、云端
base_url = http://127.0.0.1:1234/v1
model = your-model-name
# 本地服务可填 DUMMY；云端请填真实 Key（仅存在于本地 config.ini）
api_key = DUMMY
# auto 表示用 default_context_window；也可写 131072 或 128k
context_window = auto
default_context_window = 131072
request_timeout = 600
# 压缩摘要时传给模型的 reasoning_effort（部分兼容服务不支持会自动降级重试）
summary_reasoning_effort = none

[agent]
name = jagent
# 单次用户输入内最多执行多少轮"模型→工具→模型"
max_steps = 8

[ui]
title = jagent
sub_title = 本地大模型终端助手
theme = tokyo-night
sidebar_width = 38
autocomplete_enabled = true
command_panel_max_items = 12

[context]
archive_dir = .agents/context
warning_ratio = 0.6
summary_target_tokens = 5000
max_results = 8
max_chars = 6000
snippet_radius = 180

[sessions]
dir = .agents/sessions
autosave_on_quit = true
autosave_on_new = true
autosave_after_turn = true
title_length = 60

[mcp]
enabled = true
config_path = .mcp.json
connect_timeout = 30
call_timeout = 60
max_tool_name_length = 64

[tools]
cli_timeout = 30
cli_max_timeout = 300
cli_max_output_chars = 4000
web_timeout = 30
web_connect_timeout = 10
web_max_summary_chars = 600
# 文件工具边界：留空表示项目根目录；allow_outside_workspace=false 时拒绝越界路径
workspace_root =
allow_outside_workspace = false
search_api_url = https://qianfan.baidubce.com/v2/ai_search/web_search
search_top_k = 10
search_timeout = 30
user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36

[skills]
dir = .agents/skills
max_name_length = 64
max_description_length = 1024

[agents]
enabled = true
# 优先 file，不存在时按 candidates 依次回退（兼容 AGENT.md / AGENTS.md）
file = AGENTS.md
candidates = AGENT.md,AGENTS.md,.agents/AGENT.md
max_chars = 20000

[logging]
file = .agents/logs/jagent.log
level = INFO

[search]
# 百度千帆搜索 API Key（https://qianfan.baidubce.com），缺失时 searchWeb 返回 CONFIG_MISSING
baidu_qianfan_api_key = YOUR_SEARCH_API_KEY
